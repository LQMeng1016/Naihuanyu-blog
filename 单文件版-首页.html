<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奈欢yu的博客</title>
<style>
/* ===== 拾光 × 素笺 · 样式 =====
   课程卡片式知识库：语言学习类 / 编程类 / 书籍类
   6 套主题 × 深浅模式，随时切换 */

/* ---------- 主题色（浅色） ---------- */
body[data-theme="matcha"]{  /* 抹茶绿 */
  --paper:#f5f7f1;--ink:#3a4235;--muted:#8f9a86;--accent:#7d9c6a;--line:#e4e9dc;
}
body[data-theme="sky"]{     /* 淡蓝 */
  --paper:#f2f6fa;--ink:#2c3a4a;--muted:#7d8fa3;--accent:#6b9ac4;--line:#dfe7ef;
}
body[data-theme="washi"]{   /* 素笺暖纸 */
  --paper:#f7f4ef;--ink:#3d3a36;--muted:#9a938a;--accent:#b0885a;--line:#e6e0d6;
}
body[data-theme="mono"]{    /* 拾光黑白 */
  --paper:#ffffff;--ink:#1a1a1a;--muted:#888888;--accent:#1a1a1a;--line:#e8e8e8;
}
body[data-theme="line"]{    /* 现代线条 */
  --paper:#fafafa;--ink:#111111;--muted:#6b6b6b;--accent:#4f6ef7;--line:#e5e5e5;
}
body[data-theme="term"]{    /* 终端极客 */
  --paper:#f4f6f3;--ink:#1c211a;--muted:#70776a;--accent:#3fb950;--line:#dfe3da;
}

/* ---------- 主题色（深色） ---------- */
body[data-theme="matcha"].dark{--paper:#1f241c;--ink:#dfe6d8;--muted:#93a088;--accent:#a8c48f;--line:#2e3529;}
body[data-theme="sky"].dark{   --paper:#1c242e;--ink:#dbe4ee;--muted:#8fa0b3;--accent:#8fb7dd;--line:#2c3742;}
body[data-theme="washi"].dark{ --paper:#26221c;--ink:#e8e2d8;--muted:#a89f92;--accent:#c9a06b;--line:#37312a;}
body[data-theme="mono"].dark{  --paper:#121212;--ink:#f0f0f0;--muted:#9a9a9a;--accent:#f0f0f0;--line:#2a2a2a;}
body[data-theme="line"].dark{  --paper:#15161a;--ink:#e8eaef;--muted:#8b90a0;--accent:#6b86f5;--line:#262830;}
body[data-theme="term"].dark{  --paper:#0f1115;--ink:#d4d4d4;--muted:#6b7280;--accent:#7ee787;--line:#23272f;}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong",serif;
  line-height:2;-webkit-font-smoothing:antialiased;
  transition:background .35s,color .35s;
}
a{color:var(--ink);}
.wrap{max-width:760px;margin:0 auto;padding:0 28px;}

header{padding:100px 0 36px;}
.site-name{font-size:24px;letter-spacing:3px;font-weight:700;display:inline-flex;align-items:center;gap:14px;flex-wrap:wrap;}
.site-name img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--line);}
.site-name::after{content:"";flex-basis:100%;height:1px;background:var(--accent);margin:10px 0 0;transition:background .35s;}
.site-desc{color:var(--muted);font-size:14px;margin-top:10px;letter-spacing:2px;}

nav{
  position:sticky;top:0;z-index:50;
  padding:14px 0;background:var(--paper);
  border-bottom:1px solid var(--line);
  margin-bottom:48px;
  transition:background .35s;
}
nav a{color:var(--muted);text-decoration:none;font-size:14px;margin-right:28px;letter-spacing:2px;transition:color .2s;}
nav a:hover{color:var(--accent);}

/* ---------- 板块 ---------- */
.section{margin-bottom:40px;}
.section-title{font-size:16px;letter-spacing:3px;color:var(--muted);margin-bottom:18px;display:flex;align-items:center;gap:10px;}
.section-title::before{content:"";width:18px;height:1px;background:var(--accent);}

/* ---------- 课程卡片 ---------- */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:540px){.cards{grid-template-columns:1fr;}}

/* ---------- 大类板块卡片（首页） ---------- */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.cat-card{
  display:block;text-decoration:none;color:var(--ink);
  border:1px solid var(--line);border-radius:14px;
  background:var(--paper);padding:22px;
  transition:transform .2s,box-shadow .2s,border-color .2s,background .35s,color .35s;
}
.cat-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.08);border-color:var(--accent);}
.cat-icon{font-size:30px;}
.cat-name{font-size:20px;font-weight:700;letter-spacing:2px;margin-top:10px;}
.cat-desc{font-size:13px;color:var(--muted);margin:4px 0 14px;}
.cat-foot{display:flex;justify-content:space-between;align-items:center;}
.cat-count{font-size:12px;color:var(--muted);letter-spacing:1px;}
.card{
  position:relative;overflow:hidden;
  display:block;text-decoration:none;
  border:1px solid var(--line);border-radius:12px;
  background:var(--paper);padding:18px 18px 14px;
  color:var(--ink);
  transition:transform .2s,box-shadow .2s,border-color .2s,background .35s,color .35s;
}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.08);border-color:var(--accent);}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);}
.c-name{font-size:17px;font-weight:600;letter-spacing:1px;display:flex;align-items:center;gap:8px;}
.c-desc{font-size:13px;color:var(--muted);margin:4px 0 12px;}
.c-foot{display:flex;justify-content:space-between;align-items:center;}
.badge{font-size:11px;padding:1px 9px;border-radius:10px;letter-spacing:1px;}
.badge.on{background:var(--accent);color:#fff;}
.badge.soon{border:1px dashed var(--muted);color:var(--muted);}
.c-count{font-size:12px;color:var(--muted);letter-spacing:1px;}

/* ---------- 最新更新（占位） ---------- */
.empty{
  border:1px dashed var(--line);border-radius:12px;
  padding:36px;text-align:center;color:var(--muted);
  font-size:14px;letter-spacing:2px;
}

footer{margin-top:72px;padding:32px 0 64px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center;letter-spacing:2px;}

/* ---------- 单词表 ---------- */
.words-nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 8px;}
.words-nav a{
  font-size:13px;color:var(--muted);text-decoration:none;letter-spacing:1px;
  padding:5px 14px;border:1px solid var(--line);border-radius:16px;
  transition:color .2s,border-color .2s;
}
.words-nav a:hover{color:var(--accent);border-color:var(--accent);}
.words-table{width:100%;border-collapse:collapse;margin:10px 0 34px;}
.words-table th{
  font-size:13px;color:var(--muted);letter-spacing:2px;font-weight:600;
  padding:8px 14px;border-bottom:2px solid var(--line);text-align:left;
}
.words-table td{
  padding:9px 14px;border-bottom:1px solid var(--line);
  font-size:16px;vertical-align:middle;
}
.words-table tr:hover td{background:var(--line);}
.words-table td.zh{font-size:14px;color:var(--ink);}
ruby rt{font-size:11px;color:var(--accent);font-weight:400;transition:color .35s;}
.words-wrap{overflow-x:auto;}

/* ---------- 单词自测 ---------- */
.quiz-bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:18px 0 6px;}
.quiz-bar label{font-size:13px;color:var(--muted);letter-spacing:1px;cursor:pointer;}
.quiz-bar label input{margin-right:4px;accent-color:var(--accent);}
.quiz-btn{
  display:inline-block;padding:9px 26px;border-radius:22px;border:none;cursor:pointer;
  background:var(--accent);color:#fff;font-size:14px;letter-spacing:2px;
  transition:transform .2s,box-shadow .2s;
}
.quiz-btn:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.15);}
.quiz-box{
  border:1px solid var(--line);border-radius:14px;padding:22px;
  background:var(--paper);margin:16px 0 30px;
  transition:background .35s,border-color .35s;
}
.quiz-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);letter-spacing:1px;}
.quiz-question{font-size:26px;text-align:center;padding:26px 0 22px;letter-spacing:2px;}
.quiz-question ruby rt{font-size:13px;}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:540px){.quiz-options{grid-template-columns:1fr;}}
.quiz-option{
  border:1px solid var(--line);border-radius:10px;padding:13px 10px;cursor:pointer;
  text-align:center;font-size:15px;background:var(--paper);
  transition:border-color .2s,background .2s,color .2s;
}
.quiz-option:hover{border-color:var(--accent);}
.quiz-option.correct{background:var(--accent);color:#fff;border-color:var(--accent);}
.quiz-option.wrong{background:#c96a5e;color:#fff;border-color:#c96a5e;}
.quiz-input-row{display:flex;gap:10px;justify-content:center;align-items:center;margin:6px 0 8px;}
.quiz-input{
  flex:1;max-width:280px;padding:11px 16px;border-radius:22px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);
  font-size:16px;text-align:center;letter-spacing:1px;outline:none;
  transition:border-color .2s,background .35s,color .35s;
}
.quiz-input:focus{border-color:var(--accent);}
.quiz-feedback{text-align:center;font-size:14px;color:var(--muted);margin-top:12px;min-height:22px;letter-spacing:1px;}
.quiz-feedback ruby rt{font-size:10px;}
.quiz-foot{display:flex;justify-content:center;gap:12px;margin-top:14px;flex-wrap:wrap;}
.quiz-result{text-align:center;padding:8px 0;}
.quiz-result .score{font-size:20px;font-weight:700;letter-spacing:2px;margin-bottom:8px;}
.quiz-wrong-list{font-size:13px;color:var(--muted);margin-top:10px;line-height:2;}
.quiz-wrong-list ruby rt{font-size:10px;}

/* ---------- 文章页（五十音图等知识内容） ---------- */
.post-title{font-size:26px;font-weight:700;letter-spacing:2px;margin-top:14px;}
.post-meta{font-size:12px;color:var(--muted);letter-spacing:1px;margin-top:8px;}
.tip-box{
  border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;
  padding:14px 16px;background:var(--paper);
  font-size:14px;color:var(--muted);margin:22px 0;line-height:2;
  transition:background .35s,border-color .35s;
}
.tip-box strong{color:var(--ink);font-weight:600;}
.section-h{font-size:17px;letter-spacing:3px;margin:30px 0 4px;font-weight:600;}
.section-h .sub{font-size:12px;color:var(--muted);letter-spacing:1px;margin-left:8px;font-weight:400;}
.kana-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 8px;}
.kana-cell{
  border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;
  background:var(--paper);transition:background .35s,border-color .35s;
}
.kana-cell .hira{font-size:22px;display:block;line-height:1.3;}
.kana-cell .kata{font-size:14px;color:var(--muted);display:block;margin-top:2px;line-height:1.3;}
.kana-cell .romaji{font-size:11px;color:var(--accent);display:block;margin-top:3px;letter-spacing:1px;transition:color .35s;}
.kana-cell.empty{color:var(--muted);opacity:.4;font-size:14px;display:flex;align-items:center;justify-content:center;}
.note{font-size:13px;color:var(--muted);letter-spacing:1px;margin-top:10px;}

/* ---------- 404 / 开发中页面 ---------- */
.developing{text-align:center;padding:90px 0 40px;}
.dev-icon{font-size:64px;}
.developing h1{font-size:24px;letter-spacing:4px;margin-top:22px;font-weight:700;}
.dev-sub{color:var(--muted);font-size:14px;margin-top:14px;letter-spacing:1px;}
.dev-note{color:var(--muted);font-size:13px;margin-top:8px;letter-spacing:1px;}
.dev-actions{display:flex;gap:14px;justify-content:center;margin-top:34px;flex-wrap:wrap;}
.dev-btn{display:inline-block;padding:10px 28px;border-radius:24px;text-decoration:none;font-size:14px;letter-spacing:2px;transition:transform .2s,box-shadow .2s,background .35s,color .35s;}
.dev-btn.primary{background:var(--accent);color:#fff;}
.dev-btn.ghost{border:1px solid var(--line);color:var(--muted);}
.dev-btn:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.1);}

/* ---------- 课程详情页 ---------- */
.course-head{margin:28px 0 32px;}
.back{font-size:13px;color:var(--muted);text-decoration:none;letter-spacing:1px;transition:color .2s;}
.back:hover{color:var(--accent);}
.course-title{font-size:26px;font-weight:700;letter-spacing:2px;margin-top:14px;}
.course-desc{font-size:14px;color:var(--muted);margin-top:8px;letter-spacing:1px;}
.course-meta{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:13px;color:var(--muted);letter-spacing:1px;}

.grade{margin-bottom:22px;border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:var(--paper);transition:background .35s,border-color .35s;}
.grade-head{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
.grade-tag{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0;transition:background .35s;}
.grade-name{font-size:17px;font-weight:600;letter-spacing:1px;}
.grade-book{font-size:12px;color:var(--muted);margin-top:2px;}
.grade-head .badge{margin-left:auto;}

/* ---------- 侧边快捷导航（课程页） ---------- */
.side-nav{
  position:fixed;right:20px;top:50%;transform:translateY(-50%);
  z-index:40;display:flex;flex-direction:column;gap:4px;
  padding:10px;border:1px solid var(--line);border-radius:12px;
  background:var(--paper);
  transition:background .35s,border-color .35s;
}
.side-nav a{
  font-size:13px;color:var(--muted);text-decoration:none;letter-spacing:1px;
  padding:6px 10px;border-radius:8px;
  transition:color .2s,background .2s;
}
.side-nav a:hover{color:var(--accent);}
.side-nav a.active{color:var(--accent);background:var(--line);}
@media (max-width:900px){.side-nav{display:none;}}

/* 锚点跳转时避开吸顶导航 */
section[id]{scroll-margin-top:80px;}

/* ---------- 调色板按钮 / 面板 ---------- */
#palette-btn{
  position:fixed;top:20px;right:20px;z-index:99;
  width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);
  font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  transition:background .35s,color .35s,transform .2s;
}
#palette-btn:hover{transform:scale(1.08) rotate(20deg);}
#panel{
  position:fixed;top:72px;right:20px;z-index:100;
  width:240px;background:var(--paper);color:var(--ink);
  border:1px solid var(--line);border-radius:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.16);
  padding:16px;display:none;
  transition:background .35s,color .35s;
}
#panel.open{display:block;}
#panel h3{font-size:13px;letter-spacing:2px;color:var(--muted);font-weight:600;margin-bottom:12px;}
.swatches{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.swatch{
  border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;
  background:var(--paper);transition:border-color .2s,transform .15s;text-align:left;
}
.swatch:hover{transform:translateY(-2px);}
.swatch.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
.swatch .s-name{font-size:12px;color:var(--ink);margin-bottom:6px;display:block;}
.swatch .s-dots{display:flex;gap:4px;}
.swatch .s-dots i{width:18px;height:12px;border-radius:3px;display:block;border:1px solid rgba(0,0,0,.08);}
.mode-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);}
.mode-row span{font-size:13px;color:var(--muted);letter-spacing:1px;}
.switch{width:44px;height:22px;border-radius:11px;background:var(--line);position:relative;cursor:pointer;transition:background .3s;}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .25s;}
.switch.dark-mode{background:var(--accent);}
.switch.dark-mode::after{left:24px;}

/* ---------- 回到顶部 ---------- */
#to-top{
  position:fixed;bottom:24px;right:24px;z-index:99;
  width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:var(--paper);color:var(--accent);
  font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  opacity:0;pointer-events:none;
  transition:opacity .3s,transform .2s,background .35s,color .35s;
}
#to-top.show{opacity:1;pointer-events:auto;}
#to-top:hover{transform:translateY(-3px);}

</style>
</head>

  <!-- 最新更新（占位） -->
  <section class="section">
    <h2 class="section-title">最新更新</h2>
    <div class="empty">📝 还没有文章，等你写下第一篇</div>
  </section>

  <footer>© 2026 奈欢yu的博客 · 生命不息-学习不止</footer>
</div>

<button id="palette-btn" title="切换主题">🎨</button>
<button id="to-top" title="回到顶部">↑</button>

<div id="panel">
  <h3>主题配色</h3>
  <div class="swatches">
    <button class="swatch" data-theme="matcha"><span class="s-name">抹茶绿</span><span class="s-dots"><i style="background:#7d9c6a"></i><i style="background:#1f241c"></i><i style="background:#a8c48f"></i></span></button>
    <button class="swatch" data-theme="sky"><span class="s-name">淡蓝</span><span class="s-dots"><i style="background:#6b9ac4"></i><i style="background:#1c242e"></i><i style="background:#8fb7dd"></i></span></button>
    <button class="swatch" data-theme="washi"><span class="s-name">素笺暖纸</span><span class="s-dots"><i style="background:#b0885a"></i><i style="background:#26221c"></i><i style="background:#c9a06b"></i></span></button>
    <button class="swatch" data-theme="mono"><span class="s-name">拾光黑白</span><span class="s-dots"><i style="background:#1a1a1a"></i><i style="background:#121212"></i><i style="background:#f0f0f0"></i></span></button>
    <button class="swatch" data-theme="line"><span class="s-name">现代线条</span><span class="s-dots"><i style="background:#4f6ef7"></i><i style="background:#15161a"></i><i style="background:#6b86f5"></i></span></button>
    <button class="swatch" data-theme="term"><span class="s-name">终端极客</span><span class="s-dots"><i style="background:#3fb950"></i><i style="background:#0f1115"></i><i style="background:#7ee787"></i></span></button>
  </div>
  <div class="mode-row">
    <span>深色模式</span>
    <div class="switch" id="mode-switch"></div>
  </div>
</div>

<script>
/* ===== 拾光 × 素笺 · 交互逻辑 =====
   主题切换（6 套配色 × 深浅模式，localStorage 记忆）
   调色板面板开关 / 回到顶部 */

(function () {
  'use strict';

  var THEME_KEY = 'shiguang_theme',   // 记录所选主题
      MODE_KEY = 'shiguang_mode';     // 记录深浅模式
  var body = document.body;

  /* ---------- 应用主题 / 模式 ---------- */
  function applyTheme(t) {
    body.dataset.theme = t;
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
    var swatches = document.querySelectorAll('.swatch');
    for (var i = 0; i < swatches.length; i++) {
      swatches[i].classList.toggle('active', swatches[i].dataset.theme === t);
    }
  }

  function applyMode(m) {
    body.classList.toggle('dark', m === 'dark');
    var sw = document.getElementById('mode-switch');
    if (sw) sw.classList.toggle('dark-mode', m === 'dark');
    try { localStorage.setItem(MODE_KEY, m); } catch (e) {}
  }

  /* ---------- 初始化：恢复上次选择（默认 抹茶绿 + 深色） ---------- */
  var savedTheme = null, savedMode = null;
  try {
    savedTheme = localStorage.getItem(THEME_KEY);
    savedMode = localStorage.getItem(MODE_KEY);
  } catch (e) {}
  applyTheme(savedTheme || 'matcha');
  applyMode(savedMode || 'dark');

  /* ---------- 调色板面板开关 ---------- */
  var panel = document.getElementById('panel');
  var paletteBtn = document.getElementById('palette-btn');
  if (panel && paletteBtn) {
    paletteBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      panel.classList.toggle('open');
    });
    document.addEventListener('click', function (e) {
      if (!panel.contains(e.target) && e.target.id !== 'palette-btn') {
        panel.classList.remove('open');
      }
    });
  }

  /* ---------- 色卡点击切换主题 ---------- */
  var swatches = document.querySelectorAll('.swatch');
  for (var i = 0; i < swatches.length; i++) {
    swatches[i].addEventListener('click', function () {
      applyTheme(this.dataset.theme);
    });
  }

  /* ---------- 深浅切换 ---------- */
  var modeSwitch = document.getElementById('mode-switch');
  if (modeSwitch) {
    modeSwitch.addEventListener('click', function () {
      applyMode(body.classList.contains('dark') ? 'light' : 'dark');
    });
  }

  /* ---------- 每板块最多展示 3 张课程卡 + 1 张「更多」= 刚好两排，超出自动折叠 ---------- */
  var cardsBoxes = document.querySelectorAll('.cards');
  for (var b = 0; b < cardsBoxes.length; b++) {
    var box = cardsBoxes[b];
    var cards = box.querySelectorAll('.card');
    if (cards.length > 3) {
      for (var c = 3; c < cards.length; c++) {
        cards[c].style.display = 'none';
      }
      var more = document.createElement('a');
      more.className = 'card';
      more.href = 'course.html';
      more.style.cssText = 'display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;border-style:dashed;';
      more.innerHTML = '<div class="c-name">更多课程</div><div class="c-desc">查看该类别全部课程 →</div>';
      box.appendChild(more);
    }
  }

  /* ---------- 侧边导航：当前区块高亮 ---------- */
  var secs = document.querySelectorAll('section[id]');
  var sideLinks = document.querySelectorAll('.side-nav a');
  if (secs.length && sideLinks.length) {
    function highlightNav() {
      var pos = window.scrollY + 140;
      var current = secs[0].id;
      for (var i = 0; i < secs.length; i++) {
        if (secs[i].offsetTop <= pos) current = secs[i].id;
      }
      for (var j = 0; j < sideLinks.length; j++) {
        sideLinks[j].classList.toggle('active', sideLinks[j].getAttribute('href') === '#' + current);
      }
    }
    window.addEventListener('scroll', highlightNav);
    highlightNav();
  }

  /* ---------- 回到顶部 ---------- */
  var topBtn = document.getElementById('to-top');
  if (topBtn) {
    window.addEventListener('scroll', function () {
      topBtn.classList.toggle('show', window.scrollY > 400);
    });
    topBtn.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }
})();

</script>
</body>
</html>
