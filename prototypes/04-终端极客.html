<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>~/knowledge — 我的知识库</title>
<style>
  /* ===== 原型 D：终端极客 · 等宽字体 · 单色 ===== */
  :root{
    --bg:#0f1115;
    --fg:#d4d4d4;
    --dim:#6b7280;
    --accent:#7ee787;
    --line:#23272f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:"Cascadia Code","JetBrains Mono","Consolas",monospace;
    font-size:14px;
    line-height:1.8;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 24px;}

  header{padding:72px 0 32px;}
  .prompt{color:var(--accent);}
  .site-name{font-size:20px;margin-bottom:8px;}
  .site-desc{color:var(--dim);font-size:13px;}

  .bar{border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:24px 0 40px;display:flex;gap:16px;flex-wrap:wrap;}
  .bar a{color:var(--fg);text-decoration:none;font-size:13px;}
  .bar a:hover{color:var(--accent);}
  .bar a::before{content:"~$ ";color:var(--dim);}

  .post{
    padding:18px 0;border-bottom:1px solid var(--line);
  }
  .post:last-of-type{border-bottom:none;}
  .post-meta{color:var(--dim);font-size:12px;}
  .post-meta .arrow{color:var(--accent);}
  .post-title{font-size:15px;margin-top:4px;}
  .post-title a{color:var(--fg);text-decoration:none;}
  .post-title a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:4px;}
  .post-tags{margin-top:6px;}
  .tag{color:var(--dim);font-size:12px;}
  .tag::before{content:"#";color:var(--accent);}

  footer{padding:56px 0 72px;color:var(--dim);font-size:12px;}
  .cursor{display:inline-block;width:8px;height:15px;background:var(--accent);vertical-align:-2px;animation:blink 1.1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="prompt">$ whoami</div>
    <div class="site-name">~/knowledge — 我的知识库</div>
    <div class="site-desc"># 学过的 · 踩过的坑 · 想明白的事</div>
  </header>

  <div class="bar">
    <a href="#">home</a>
    <a href="#">posts</a>
    <a href="#">about</a>
    <a href="#">archive</a>
  </div>

  <div class="post">
    <div class="post-meta"><span class="arrow">→</span> 2026-08-03</div>
    <div class="post-title"><a href="#">SSH 连接云服务器完整指南</a></div>
    <div class="post-tags"><span class="tag">linux</span> <span class="tag">ssh</span> <span class="tag">新手</span></div>
  </div>

  <div class="post">
    <div class="post-meta"><span class="arrow">→</span> 2026-08-01</div>
    <div class="post-title"><a href="#">间隔复习法：把知识变成长期记忆</a></div>
    <div class="post-tags"><span class="tag">学习方法</span> <span class="tag">记忆</span></div>
  </div>

  <div class="post">
    <div class="post-meta"><span class="arrow">→</span> 2026-07-28</div>
    <div class="post-title"><a href="#">我的第一台云服务器部署记录</a></div>
    <div class="post-tags"><span class="tag">云服务器</span> <span class="tag">部署</span></div>
  </div>

  <div class="post">
    <div class="post-meta"><span class="arrow">→</span> 2026-07-20</div>
    <div class="post-title"><a href="#">极简主义笔记法</a></div>
    <div class="post-tags"><span class="tag">方法论</span></div>
  </div>

  <div class="post">
    <div class="post-meta"><span class="arrow">→</span> 2026-07-15</div>
    <div class="post-title"><a href="#">Linux 常用命令速查表</a></div>
    <div class="post-tags"><span class="tag">linux</span> <span class="tag">速查</span></div>
  </div>

  <footer>
    $ cat LICENSE<br>
    © 2026 · MIT License<span class="cursor"></span>
  </footer>
</div>
</body>
</html>
